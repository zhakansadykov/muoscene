[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "muoscene"
dynamic = ["version"]
description = "Muography scene: plan and check absorption muography of engineering-scale objects"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Zhakypbek Sadykov" }]
keywords = ["muography", "cosmic-ray muons", "nuclear emulsion", "geotechnics", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "pyyaml>=6",
    "pydantic>=2.5",
    "pyproj>=3.6",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mesh = ["trimesh>=4"]
survey = ["laspy[lazrs]>=2.5", "rasterio>=1.3", "ezdxf>=1.2", "open3d>=0.18"]
viz3d = ["pyvista>=0.43"]
data = ["uproot>=5", "awkward>=2"]
mc = ["mulder"]
mceq = ["MCEq"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
muoscene = "muoscene.cli:main"

[tool.hatch.version]
path = "src/muoscene/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/muoscene"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["validation: slow comparisons against PUMAS/Mulder and MUTE (deselect with -m 'not validation')"]
addopts = "-m 'not validation'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
