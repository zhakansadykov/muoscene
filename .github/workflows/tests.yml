name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Windows since 21 November 2026: the program is meant for users on all three systems
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    # 2.2 times the longest job so far, Windows with Python 3.12 (13 min 23 s on 668fbfe): a test that
    # never returns would hold the runner for the six hours of GitHub, as on macOS on 668fbfe (roadmap 0.1-10b)
    timeout-minutes: 30
    steps:
      # on Windows git would check the files out with CRLF, which the format check and text comparisons refuse
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # the backends are pinned here: a new release of Mulder or Calzone is met by upstream.yml first
      - run: pip install -e ".[dev]" -c .github/constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/make_zenodo_json.py --check
      - name: No site data among tracked files
        shell: bash
        run: git ls-files -z | xargs -0 python scripts/check_private.py
      - run: pytest
