name: upstream
# The newest Mulder and Calzone allowed by pyproject.toml, without the pins of constraints.txt.
# A failure here means a release changed the frozen numbers: read tests/regression/README.md.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # the tests and then the validation tests, which take 81 s on the Linux VM and 5 to 7 times that on
    # macOS: about 20 minutes there; 45 stops a job that hangs instead of the six hours of GitHub
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --upgrade -e ".[dev]"
      - run: pip list
      - run: pytest
      - name: Discrete transport on the reference void
        run: pytest -m validation
